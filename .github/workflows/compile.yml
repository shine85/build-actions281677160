#
# 编译主程序,请勿修改文件名称（compile.yml）
#
#


name: 编译主程序
on:
  push:
    branches:
      - main
    paths:
      - 'build/Immortalwrt/relevance/start'

env:
  GIT_REPOSITORY: ${{github.repository}}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: 编译 "${{matrix.target}}"
    runs-on: ubuntu-22.04
  # if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}
    if: ${{ github.event.repository.owner.id == github.event.sender.id }}
    env:
      FOLDER_NAME: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
       target: [Immortalwrt]

    steps:
    - name: 释放Ubuntu磁盘空间
      uses: danshui-git/free-disk-space@main
      with:
        remove_android: true
        remove_dotnet: true
        remove_haskell: true
        remove_tool_cache: true
        remove_swap: true
        remove_docker_image: true
        remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
        remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/share/glade* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell"
        
    - name: 准备结束
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: ${{ github.sha }}

    - name: 选择本次编译使用的diy脚本
      run: bash tools/immortalwrt-config.sh select

    - name: 检测密匙/文件/版本
      uses: ./.github/actions/immortalwrt-mishi

    - name: 应用上游编译修复
      run: bash tools/prepare-immortalwrt.sh

    - name: 部署编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        export TMP_DIR="${RUNNER_TEMP}/immortalwrt-dependencies"
        mkdir -p "$TMP_DIR"
        sudo --preserve-env=DEBIAN_FRONTEND,TMP_DIR bash -e -o pipefail "${LINSHI_COMMON}/custom/ubuntu.sh"
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /${{ env.DIY_WORK }}
        sudo chown ${USER}:${GROUPS} /${{ env.DIY_WORK }}

    - name: 下载"${{matrix.target}}"源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sf /${{ env.DIY_WORK }}/openwrt ${GITHUB_WORKSPACE}/openwrt
        bash ${{ env.COMMON_SH }} Diy_feedsconf
    
    - name: 公告
      continue-on-error: true
      uses: 281677160/common@message
 
    - name: 运行自定义文件和其他
      uses: 281677160/common@need

    - name: 补回kucat并核验所选插件
      run: node tools/immortalwrt-plugins.cjs
        
    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: 281677160/common@message
        
    - name: 缓存加速
      if: env.CACHEWRTBUILD_SWITCH == 'true'
      uses: stupidloud/cachewrtbuild@main
      with:
        ccache: 'true'
        mixkey: "${{ env.TARGET_PROFILE }}"
        prefix: ${{ github.workspace }}/openwrt
        
    - name: 下载软件包
      id: package
      run: |
        cd openwrt
        make download -j8

    - name: 开始编译固件
      id: compile
      if: steps.package.outcome == 'success'
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 V=s
        printf 'IMMORTALWRT_COMPILED_AT=%s\n' "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

    - name: 自动打包armsr_rootfs_tar_gz
      if: steps.compile.outcome == 'success' && env.ONLINE_FIRMWARE == 'true'
      uses: 281677160/common@aarch

    - name: 启动固件并验收网络和插件
      if: steps.compile.outcome == 'success' && env.TARGET_BOARD == 'x86'
      run: |
        export IMMORTALWRT_RUNTIME_REPORT="$GITHUB_WORKSPACE/tmp/immortalwrt-runtime-verification.json"
        printf 'IMMORTALWRT_RUNTIME_REPORT=%s\n' "$IMMORTALWRT_RUNTIME_REPORT" >> "$GITHUB_ENV"
        node tools/immortalwrt-runtime.cjs

    - name: 保存固件运行验收报告
      if: always() && steps.compile.outcome == 'success' && env.TARGET_BOARD == 'x86'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: firmware-runtime-${{ env.CONFIG_FILE }}-${{ env.LUCI_EDITION }}-attempt-${{ github.run_attempt }}
        path: ${{ env.IMMORTALWRT_RUNTIME_REPORT }}
        if-no-files-found: error

    - name: 保存失败固件诊断镜像
      if: failure() && steps.compile.outcome == 'success' && env.TARGET_BOARD == 'x86' && env.UPLOAD_FIRMWARE == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: firmware-debug-${{ env.CONFIG_FILE }}-${{ env.LUCI_EDITION }}-attempt-${{ github.run_attempt }}
        path: |
          ${{ env.FIRMWARE_PATH }}/*-squashfs-combined*.img.gz
          ${{ env.FIRMWARE_PATH }}/*.manifest
        if-no-files-found: error
        retention-days: 3

    - name: 生成发布标题和插件说明
      if: steps.compile.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true'
      uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
      with:
        script: |
          const release = require(process.env.GITHUB_WORKSPACE + '/tools/immortalwrt-release.cjs');
          const info = await release.describe();
          core.exportVariable('IMMORTALWRT_RELEASE_NAME', info.name);
          core.exportVariable('IMMORTALWRT_RELEASE_BODY', info.body);

    - name: 整理固件文件夹(需配合diy-part.sh设定使用)
      if: steps.compile.outcome == 'success'
      run: |
        cd openwrt
        bash -e "${COMMON_SH}" Diy_firmware

    - name: 发送[在线更新固件]至云端
      if: steps.compile.outcome == 'success' && env.UPDATE_FIRMWARE_ONLINE == 'true'
      uses: ./.github/actions/immortalwrt-release
        
    - name: 上传,发布,信息通知
      if: steps.compile.outcome == 'success'
      uses: 281677160/common@uploads

    - name: 编译失败通知
      if: failure() && ((env.INFORMATION_NOTICE == 'TG' && env.TELEGRAM_BOT_TOKEN) || (env.INFORMATION_NOTICE == 'PUSH' && env.PUSH_PLUS_TOKEN))
      continue-on-error: true
      run: |
        TZ_Message="$(date +%Y年%m月%d号%H时%M分)"
        TEXT="${SOURCE}-${LUCI_EDITION}，${TARGET_PROFILE}固件，编译失败，(${WAREHOUSE_MAN}-#${RUN_NUMBER})，${TZ_Message}"
        if [[ "${INFORMATION_NOTICE}" == "TG" ]]; then
          curl -sS -X POST -H "Content-Type: application/json" -d "{\"chat_id\":\"${TELEGRAM_CHAT_ID}\",\"text\":\"${TEXT}\"}" "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"
        fi
        if [[ "${INFORMATION_NOTICE}" == "PUSH" ]]; then
          curl -sS -X POST -H "Content-Type: application/json" -d "{\"token\":\"${PUSH_PLUS_TOKEN}\",\"title\":\"${SOURCE}-${LUCI_EDITION}\",\"content\":\"${TEXT}\"}" "https://www.pushplus.plus/send"
        fi
