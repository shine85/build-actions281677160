#
# 请大家记住拉取的是我的 281677160/build-actions 仓库，拉取的是其他仓库有问题，别问我，我也不清楚什么问题
#
# 因为SSH连接配置固件直接编译，会给github停止编译的,所以要另外触发启动编译程序
#
# 一般情况下都能触发启动编译的，除非没设置好密匙，或者密匙过期了，或者密匙错误之类的
#
# REPO_TOKEN密匙制作教程：https://git.io/jm.md
#
#

name: Immortalwrt-天灵-250
on:
  workflow_dispatch:
    inputs:
      REPO_BRANCH:
        description: '天灵源码-请选择分支'
        required: true
        default: 'openwrt-24.10'
        type: choice
        options:
          - 'openwrt-24.10'
          - 'openwrt-23.05'
          - 'master'
      CONFIG_FILE:
        description: '请选择[seed文件夹内]的配置文件'
        required: true
        default: 'x86_64_250'
        type: choice
        options:
          - 'x86_64_250'

      INFORMATION_NOTICE:
        description: 'Telegram或pushplus信息通知'
        required: true
        default: '关闭'
        type: choice
        options:
          - '关闭'
          - 'Telegram'
          - 'Pushplus'
      KEEP_WORKFLOWS:
        description: '清理workflows,保留[X]个runs不被清理'
        required: true
        default: '30'
      KEEP_RELEASES:
        description: '清理Releases,保留[X]个Releases不被清理'
        required: true
        default: '30'
      SSH_ACTION:
        description: 'SSH远程配置固件'
        required: false
        default: 'false'
        type: boolean
      UPLOAD_FIRMWARE:
        description: '上传固件到 Github Artifacts'
        required: false
        default: 'true'
        type: boolean
      UPLOAD_RELEASE:
        description: '发布固件到 Github Releases'
        required: false
        default: 'false'
        type: boolean
      CACHEWRTBUILD_SWITCH:
        description: '缓存加速编译'
        required: false
        default: 'true'
        type: boolean
      UPDATE_FIRMWARE_ONLINE:
        description: '在线更新固/打包aarch64系列为img固件'
        required: false
        default: 'true'
        type: boolean


# 如若启动定时编译的话,配置文件是设置对应文件夹内的settings.ini文件
# 定时触发开启开始编译(把下面两个#去掉开启,时间设置请看定时开启编译说明)
# #每个星期5，22点00执行；北京时间次日6点20
#  schedule:
#   - cron: 00 22 * * 5

env:
  GIT_REPOSITORY: ${{github.repository}}
  REPO_TOKEN: ${{ secrets.REPO_TOKEN }}
  PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  TZ: Asia/Shanghai

jobs:
  build:
    name: 启动"${{ matrix.target }}-${{ github.event.inputs.REPO_BRANCH }}"触发编译
    runs-on: ubuntu-22.04
    if: ${{ github.event.repository.owner.id }} == ${{ github.event.sender.id }}
    
    env:
      FOLDER_NAME: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        target: [Immortalwrt]
        
        # 请勿对 target: [Immortalwrt] 做任何修改
        
    steps:
    - name: 准备结束
      uses: actions/checkout@v4

    - name: 选择本次编译使用的diy脚本
      run: |
        cd "${GITHUB_WORKSPACE}/build/${FOLDER_NAME}"
        # 备份仓库原版diy-part.sh,mishi之后还原,确保仓库内diy-part.sh始终是6网段版本
        cp -f diy-part.sh /tmp/diy-part.sh.orig
        # 手动触发取输入框的机型,定时或其他触发取settings.ini的机型
        PICK_CONFIG="${{ github.event.inputs.CONFIG_FILE }}"
        if [[ -z "${PICK_CONFIG}" ]]; then
           PICK_CONFIG="$(grep -m1 '^CONFIG_FILE=' settings.ini | sed -E 's/^CONFIG_FILE=//; s/[[:space:]]*#.*$//; s/^"//; s/"[[:space:]]*$//')"
        fi
        if [[ "${PICK_CONFIG}" == *_250 ]] && [[ -f "diy-part-250.sh" ]]; then
           cp -f diy-part-250.sh diy-part.sh
           chmod +x diy-part.sh
           echo -e "\033[32m 机型[${PICK_CONFIG}]:本次使用 diy-part-250.sh (250网段) \033[0m"
        else
           echo -e "\033[32m 机型[${PICK_CONFIG}]:本次使用 diy-part.sh (6网段) \033[0m"
        fi
      
    - name: 检测密匙/文件/版本
      uses: 281677160/common@mishi

    - name: 还原diy-part.sh(避免250网段配置被固化回仓库)
      run: |
        if [[ -f "/tmp/diy-part.sh.orig" ]]; then
           cp -f /tmp/diy-part.sh.orig "${COMPILE_PATH}/diy-part.sh"
           chmod +x "${COMPILE_PATH}/diy-part.sh"
        fi

    - name: 部署编译环境
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -qq update -y
        sudo -E apt-get -qq install -y gawk git gettext libssl-dev xsltproc zip git-core wget curl grep python2.7 python3 python3-pip libpython3-dev
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /${{ env.DIY_WORK }}
        sudo chown $USER:$GROUPS /${{ env.DIY_WORK }}
    
    - name: 下载"${{ matrix.target }}-${{ inputs.REPO_BRANCH }}"源码
      working-directory: /${{ env.DIY_WORK }}
      run: |
        git clone -q -b "${REPO_BRANCH}" --single-branch "${REPO_URL}" openwrt
        ln -sf /${{ env.DIY_WORK }}/openwrt ${GITHUB_WORKSPACE}/openwrt
        bash ${{ env.COMMON_SH }} Diy_feedsconf
        echo "SHANG_CHUAN=true" >> ${GITHUB_ENV}
    
    - name: 公告
      continue-on-error: true
      uses: 281677160/common@message
 
    - name: 运行其他和SSH远程(make menuconfig)
      id: info
      uses: 281677160/common@need

    - name: 补回kucat配置插件到即将写入seed的配置
      run: |
        # 上游Diy_scripts按主题名执行 sed "/kucat/d",会连带删掉kucat-config两项,
        # 这里补回,保证@trigger推回仓库的seed始终带这两项
        for P in luci-app-kucat-config luci-i18n-kucat-config-zh-cn; do
           if grep -q "^CONFIG_PACKAGE_${P}=y$" "${CONFIG_TXT}"; then
              echo -e "\033[32m 已存在 CONFIG_PACKAGE_${P}=y \033[0m"
           else
              echo "CONFIG_PACKAGE_${P}=y" >> "${CONFIG_TXT}"
              echo -e "\033[32m 已补回 CONFIG_PACKAGE_${P}=y \033[0m"
           fi
        done
        
    - name: 编译信息
      continue-on-error: true
      if: env.COMPILATION_INFORMATION == 'true'
      uses: 281677160/common@message
    
    - name: 清理releases和workflows
      continue-on-error: true
      uses: danshui-git/delete-releases-workflows@main
      with:
        delete_releases: true
        prerelease_option: all
        releases_keep_keyword: targz/Update
        releases_keep_latest: ${{ env.KEEP_RELEASES }}
        delete_tags: true
        max_releases_fetch: 300
        delete_workflows: true
        workflows_keep_latest: ${{ env.KEEP_WORKFLOWS }}
        max_workflows_fetch: 300
        repo: ${{ github.repository }}
        gh_token: ${{ secrets.REPO_TOKEN }}
        
    - name: 触发启动"${{ matrix.target }}"开始编译
      if: steps.info.outcome == 'success'
      uses: 281677160/common@trigger
